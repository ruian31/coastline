<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
import{preserveRooibosCutoutMips,centerPlantAlphaCoverage}from'/src/world/PlantTexture.ts';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true,premultipliedAlpha:false});renderer.setSize(128,128);renderer.setPixelRatio(1);renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.NoToneMapping;document.body.append(renderer.domElement);
const asset=new URLSearchParams(location.search).get('asset')??'coastal_scrub';if(!['coastal_scrub','coastal_rooibos'].includes(asset))throw Error('Unknown scrub asset');
const preparedMaps=new Set();
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,.01,20),gltf=await new GLTFLoader().loadAsync('/assets/models/'+asset+'/scrub.gltf'),models=[];scene.add(gltf.scene);gltf.scene.traverse(o=>{if(o.isMesh&&o.name.endsWith('_near')){if(asset==='coastal_rooibos'&&!preparedMaps.has(o.material.map)){preserveRooibosCutoutMips(o.material.map);preparedMaps.add(o.material.map);}o.material=new THREE.MeshBasicMaterial({map:o.material.map,side:THREE.DoubleSide,alphaTest:.45,alphaToCoverage:true,toneMapped:false});if(asset==='coastal_rooibos')centerPlantAlphaCoverage(o.material);o.geometry.computeBoundingBox();models.push(o);}else if(o.isMesh)o.visible=false;});models.sort((a,b)=>a.name.localeCompare(b.name));if(models.length!==2)throw Error('Expected two complete near plants');
window.scrubBake={render(variant,view){models.forEach((m,i)=>m.visible=i===variant);const box=models[variant].geometry.boundingBox,w=2*Math.max(Math.abs(box.min.x),Math.abs(box.max.x),Math.abs(box.min.z),Math.abs(box.max.z))+.1,h=box.max.y+.1;camera.up.set(0,1,0);camera.left=-w/2;camera.right=w/2;camera.top=h/2;camera.bottom=-h/2;
if(view===4){camera.up.set(0,0,-1);camera.position.set(0,4,0);camera.lookAt(0,0,0);camera.top=w/2;camera.bottom=-w/2;}else{const a=view*Math.PI/2;camera.position.set(Math.sin(a)*4,box.max.y/2,Math.cos(a)*4);camera.lookAt(0,box.max.y/2,0);}camera.updateProjectionMatrix();renderer.render(scene,camera);return{png:renderer.domElement.toDataURL(),width:w,height:h,maxY:box.max.y};}};window.bakeReady=true;
</script>
